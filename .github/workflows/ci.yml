name: GigBid checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  assignment-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python -m pip install pypdf==6.21.4 PyYAML==6.0.3
      - name: Assignment repository rules
        run: python -m scripts.check_assignment --output work/assignment-policy.json
      - name: Policy negative controls
        run: python -m unittest discover -s tests/policy -p 'test_*.py'
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Redacted current-tree and history secret checks
        run: python -m scripts.scan_repository_secrets --binary "$RUNNER_TEMP/gitleaks"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: assignment-policy, path: work/assignment-policy.json}
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: test_only, POSTGRES_DB: gigbid}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIGBID_TEST_DATABASE_URL: postgresql://gigbid:test_only@127.0.0.1:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install uv==0.9.6
      - run: uv sync --frozen --extra dev --extra research
      - run: uv run python scripts/check_structure.py
      - run: uv run python scripts/render_graphs.py --check
      - run: uv run ruff check .
      - run: uv run python -m pytest
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: test_only, POSTGRES_DB: gigbid}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIGBID_TEST_DATABASE_URL: postgresql://gigbid:test_only@127.0.0.1:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install uv==0.9.6
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: apps/web
      - run: npm run generate:api
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/src/lib/api/schema.d.ts
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
