name: GigBid checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: test_only, POSTGRES_DB: gigbid}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIGBID_TEST_DATABASE_URL: postgresql://gigbid:test_only@127.0.0.1:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install uv==0.9.6
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/check_structure.py
      - run: uv run python scripts/render_graphs.py --check
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env: {POSTGRES_USER: gigbid, POSTGRES_PASSWORD: test_only, POSTGRES_DB: gigbid}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GIGBID_TEST_DATABASE_URL: postgresql://gigbid:test_only@127.0.0.1:5432/gigbid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install uv==0.9.6
      - run: uv sync --frozen --extra dev
      - run: npm ci
        working-directory: apps/web
      - run: npm run generate:api
        working-directory: apps/web
      - run: git diff --exit-code -- apps/web/src/lib/api/schema.d.ts
      - run: npm run typecheck && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: apps/web/playwright-report}
