name: Recorded evaluation bundle
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: Path to a committed supplied-data experiment manifest
        required: true
        default: evals/datasets/smoke-manifest.json
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install uv==0.9.6
      - run: uv sync --frozen --extra dev
      # Automatic PR experiments await the supplied data and an actual GigSim runner.
      - name: Score supplied observations and enforce the declared gates
        env:
          GIGBID_EVAL_MANIFEST: ${{ inputs.manifest }}
        run: uv run python -m evals.runners.suite --require-supplied
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: recorded-evaluation-results, path: evals/results/latest}
