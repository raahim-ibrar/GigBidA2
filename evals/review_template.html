<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GigBid · Human review</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#100e16;color:#f0eaf9}*{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:36px 24px 80px}h1{font-size:30px;margin:8px 0 16px}h2{font-size:18px}p,li{line-height:1.65}.muted{color:#b2a8c3}.card{background:#1a1622;border:1px solid #342a43;border-radius:14px;padding:24px;margin:24px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid .card{margin:0}button,.button{border:1px solid #6c4b9b;border-radius:8px;background:#b694f3;color:#180f25;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#292034;color:#e3d4f7}button:disabled{opacity:.45;cursor:default}input[type=text]{padding:10px;background:#110e19;border:1px solid #5c476f;border-radius:7px;color:inherit;font:inherit;width:min(320px,100%)}label{cursor:pointer}.options{display:flex;flex-wrap:wrap;gap:12px}.options label{border:1px solid #4b3b5d;border-radius:8px;padding:12px}.options label:has(input:checked){background:#39264e;border-color:#b694f3}input[type=radio]{accent-color:#c29bff}blockquote{margin:16px 0;padding:16px;border-left:3px solid #b694f3;background:#241b31;line-height:1.7}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:24px}.progress{display:flex;flex-wrap:wrap;gap:6px}.progress button{padding:7px 10px;background:#251d30;color:#cab9dc;border-color:#3c304c;font-size:12px}.progress button.done{background:#254034;color:#b9ecd3}.progress button.current{outline:2px solid #c9a2fc}pre{white-space:pre-wrap;font:inherit;line-height:1.65}.alert{color:#efbaae}details{margin-top:16px}summary{cursor:pointer;color:#c9a2fc}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:24px 16px}.card{padding:20px}.options{gap:8px}.options label{padding:10px}}
</style>
<main><p class="muted">GIGBID · INDEPENDENT HUMAN REVIEW</p><h1 id="title"></h1>
<p id="origin" class="muted"></p>
<section class="card"><label>Your reviewer code <input id="reviewer" type="text" maxlength="60" placeholder="e.g. student-1"></label><p class="muted">Use the same code if you resume. Answers stay on this device and, when opened on the local review server, are saved locally. No model answers are shown.</p>
<details><summary>How to rate</summary><div id="instructions"></div></details>
<p id="save-status" role="status"></p><div id="progress" class="progress"></div></section>
<section id="item"></section><div class="actions"><button id="prev" class="secondary">Previous</button><button id="next">Save & next</button><button id="export" class="secondary">Export answers</button><strong id="count"></strong></div><p id="warning" class="alert" role="alert"></p>
</main>
<script>
const packet=__PACKET_JSON__;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let index=0,answers={},reviewer=localStorage.getItem('gigbid-reviewer')||'';
$('reviewer').value=reviewer;
function storageKey(){return packet.packet_id+':'+reviewer}
function load(){try{answers=JSON.parse(localStorage.getItem(storageKey())||'{}')}catch{answers={}}}
function complete(a){return packet.kind==='calibration'?!!a?.support&&!!a?.quality:!!a?.preference}
function payload(){return{packet_id:packet.packet_id,reviewer_id:reviewer,kind:packet.kind,ratings:packet.items.filter(i=>answers[i.id]).map(i=>({id:i.id,...answers[i.id]})),complete:packet.items.every(i=>complete(answers[i.id]))}}
async function save(){localStorage.setItem(storageKey(),JSON.stringify(answers));if(!reviewer.trim())return; if(location.protocol.startsWith('http')){try{let r=await fetch('/api/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});if(!r.ok)throw Error();$('save-status').textContent='Saved on this computer.'}catch{$('save-status').textContent='Saved in this browser. Export your answers as a backup.'}}else $('save-status').textContent='Saved in this browser. Export answers when finished.'}
function radios(name,options,current){return '<div class="options">'+options.map(([value,label])=>`<label><input type="radio" name="${name}" value="${value}" ${String(current)===String(value)?'checked':''}> ${esc(label)}</label>`).join('')+'</div>'}
function proposal(d){return `<pre>${esc(d.text)}</pre>`+Object.entries(d.screening_answers||{}).map(([q,a])=>`<h3>${esc(q)}</h3><p>${esc(a)}</p>`).join('')}
function render(){const item=packet.items[index],answer=answers[item.id]||{};$('title').textContent=packet.title;$('origin').textContent=packet.origin;
 $('instructions').innerHTML=packet.kind==='calibration'?'<p>Judge the highlighted claim using only the supplied evidence. Supported means the evidence establishes it; unsupported means it adds an unestablished fact or overstates fictional work; not factual means it is solely a future plan or question. Do not infer extra experience.</p><p>Then rate the proposal overall: <b>1</b> unusable or materially misleading; <b>2</b> major factual/relevance problems; <b>3</b> usable with substantial edits; <b>4</b> relevant and grounded with minor edits; <b>5</b> clear, grounded, specific and ready for review. Consider relevance, truthfulness, concrete approach and unanswered questions. A future plan needs no proof of identical past work.</p>':'<p>Compare A and B for the same job. Prefer truthful, relevant, specific proposals that answer screening questions and accurately label fictional work. Read source evidence when checking experience. Choose tie only if neither is meaningfully better. Do not guess model identities. These are raw candidates, so defects are part of what you should rate.</p>';
 if(packet.kind==='calibration'){$('item').innerHTML=`<div class="card"><p class="muted">Item ${index+1} of ${packet.items.length}</p><h2>Job</h2><p>${esc(item.job)}</p><h2>Evidence</h2><p>${esc(item.evidence)}</p><h2>Proposal</h2><p>${esc(item.proposal)}</p><h2>Claim to assess</h2><blockquote>${esc(item.claim)}</blockquote><h2>Is this claim supported?</h2>${radios('support',[['supported','Supported'],['unsupported','Unsupported'],['not_factual','Future plan / question']],answer.support)}<h2>Overall proposal quality</h2>${radios('quality',[1,2,3,4,5].map(n=>[n,n]),answer.quality)}</div>`}
 else{$('item').innerHTML=`<div class="card"><p class="muted">Pair ${index+1} of ${packet.items.length}</p><h2>${esc(item.job.title)}</h2><p>Requirements: ${esc((item.job.requirements||[]).join('; '))}</p><p>Screening questions: ${esc((item.job.screening_questions||[]).join('; '))}</p><details><summary>Read portfolio evidence</summary>${item.evidence.map(e=>`<h3>${esc(e.source)}</h3><p>${esc(e.text)}</p>`).join('')}</details></div><div class="grid"><section class="card"><h2>Proposal A</h2>${proposal(item.a)}</section><section class="card"><h2>Proposal B</h2>${proposal(item.b)}</section></div><div class="card"><h2>Which proposal is better?</h2>${radios('preference',[['a','A'],['b','B'],['tie','Tie']],answer.preference)}</div>`}
 $('item').querySelectorAll('input[type=radio]').forEach(el=>el.onchange=()=>{answers[item.id]={...(answers[item.id]||{}),[el.name]:el.name==='quality'?Number(el.value):el.value};save();progress()});$('prev').disabled=index===0;progress()}
function progress(){let n=packet.items.filter(i=>complete(answers[i.id])).length;$('count').textContent=`${n} / ${packet.items.length} completed`;$('progress').innerHTML=packet.items.map((i,n)=>`<button class="${complete(answers[i.id])?'done ':''}${index===n?'current':''}" data-i="${n}" aria-label="Item ${n+1}">${n+1}</button>`).join('');$('progress').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);render()});$('next').textContent=index===packet.items.length-1?'Finish & save':'Save & next'}
$('reviewer').onchange=()=>{reviewer=$('reviewer').value.trim();localStorage.setItem('gigbid-reviewer',reviewer);load();render()};
$('prev').onclick=()=>{index--;render();$('item').scrollIntoView({behavior:'smooth'})};
$('next').onclick=async()=>{if(!reviewer.trim()){$('warning').textContent='Enter a reviewer code first.';return}if(!complete(answers[packet.items[index].id])){$('warning').textContent='Choose each rating before continuing.';return}$('warning').textContent='';await save();if(index<packet.items.length-1){index++;render();$('item').scrollIntoView({behavior:'smooth'})}else if(!payload().complete){$('warning').textContent='Some earlier items are incomplete. Use the numbered buttons to finish them.'}else{$('save-status').textContent='All answers complete. Saved locally; export a backup. Tell Raahim the packet is finished.'}};
$('export').onclick=()=>{const data=JSON.stringify(payload(),null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`${packet.kind}-${reviewer||'reviewer'}-answers.json`;a.click();URL.revokeObjectURL(a.href)};load();render();
</script></html>
