name: gigbid
services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ""
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      WEB_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-gigbid_local_only}@postgres:5432/gigbid
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MODEL_CACHE_DIR: /app/work/models
      HF_HOME: /app/work/models/hf
      MODEL_PROFILE: ${MODEL_PROFILE:-open}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      GROQ_DAILY_TOKEN_CAP: ${GROQ_DAILY_TOKEN_CAP:-200000}
      STUDENT_SIM_URL: http://student-sim:8080
      STUDENT_SIM_API_KEY: ${STUDENT_SIM_API_KEY:-student_sim_local_only}
    volumes: ["model-cache:/app/work/models", "./data/processed:/app/data/processed:ro"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: [".venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-gigbid_local_only}@postgres:5432/gigbid
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://gigbid:${POSTGRES_PASSWORD:-gigbid_local_only}@postgres:5432/gigbid
      QDRANT_URL: http://qdrant:6333
      MODEL_CACHE_DIR: /app/work/models
      HF_HOME: /app/work/models/hf
      OLLAMA_BASE_URL: ${WORKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      MODEL_PROFILE: ${MODEL_PROFILE:-open}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY:-}
      STUDENT_SIM_URL: ${WORKER_STUDENT_SIM_URL:-http://student-sim:8080}
      GROQ_DAILY_TOKEN_CAP: ${GROQ_DAILY_TOKEN_CAP:-200000}
      STUDENT_SIM_API_KEY: ${STUDENT_SIM_API_KEY:-student_sim_local_only}
    volumes: ["model-cache:/app/work/models", "./data/processed:/app/data/processed:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: gigbid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gigbid_local_only}
      POSTGRES_DB: gigbid
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigbid -d gigbid"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4.1-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["127.0.0.1:6333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
  ollama:
    profiles: ["container-inference"]
    image: ollama/ollama:0.40.4
    ports: ["127.0.0.1:11435:11434"]
    volumes: ["ollama-data:/root/.ollama"]
  student-sim:
    build: {context: ., dockerfile: infra/docker/api.Dockerfile}
    command: [".venv/bin/uvicorn", "simulator.app:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      STUDENT_SIM_API_KEY: ${STUDENT_SIM_API_KEY:-student_sim_local_only}
      STUDENT_SIM_DATABASE: /app/work/simulator/student-sim.sqlite
      STUDENT_SIM_CATALOGUE: ${STUDENT_SIM_CATALOGUE:-}
      STUDENT_SIM_CLIENT_MODE: ${STUDENT_SIM_CLIENT_MODE:-rule}
      OLLAMA_BASE_URL: ${WORKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - student-sim-data:/app/work/simulator
      - ./data/processed:/app/data/processed:ro
    ports: ["127.0.0.1:8080:8080"]
  # Do not expose HTTP without bearer auth. These stdio containers are scaffold entry points.
  portfolio-mcp:
    profiles: ["mcp-stdio"]
    build: {context: ., dockerfile: infra/docker/portfolio.Dockerfile}
    stdin_open: true
  marketplace-mcp:
    profiles: ["mcp-stdio"]
    build: {context: ., dockerfile: infra/docker/marketplace.Dockerfile}
    stdin_open: true
  workspace-mcp:
    profiles: ["mcp-stdio"]
    build: {context: ., dockerfile: infra/docker/workspace.Dockerfile}
    stdin_open: true
volumes:
  model-cache:
  postgres-data:
  qdrant-data:
  ollama-data:
  student-sim-data:
